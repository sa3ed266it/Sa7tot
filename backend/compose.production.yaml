name: sa7tot-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sa7tot-api:${SA7TOT_IMAGE_TAG:-local}
    env_file:
      - ${SA7TOT_API_ENV_FILE:?Set SA7TOT_API_ENV_FILE to an external production env file}
    environment:
      APP_ENV: production
      APNS_ENVIRONMENT: production
      APNS_PRIVATE_KEY_PATH: /run/secrets/apns-private-key.p8
    ports:
      - "127.0.0.1:${SA7TOT_API_HOST_PORT:-8010}:8000"
    volumes:
      - type: bind
        source: ${SA7TOT_APNS_PRIVATE_KEY_FILE:?Set SA7TOT_APNS_PRIVATE_KEY_FILE to an external .p8 path}
        target: /run/secrets/apns-private-key.p8
        read_only: true
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
